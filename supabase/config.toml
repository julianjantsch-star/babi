# Configuração do Supabase CLI para desenvolvimento local.
project_id = "odonto-financeiro"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/definir-senha"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false          # usuários entram só por convite do admin
minimum_password_length = 8

[auth.email]
enable_signup = false
enable_confirmations = false
